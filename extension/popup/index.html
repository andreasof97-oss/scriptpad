<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScriptPad</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 280px;
      background: #0f1117;
      color: #e8eaed;
      padding: 20px;
    }
    .popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .popup-header h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .popup-text {
      font-size: 13px;
      color: #9aa0a6;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .open-panel-btn {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }
    .open-panel-btn:hover {
      background: #2563eb;
    }
    .shortcut-hint {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
    }
    .shortcut-hint kbd {
      background: #242836;
      border: 1px solid #2a2f3e;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="logo">SP</div>
    <h1>ScriptPad</h1>
  </div>
  <p class="popup-text">Your scripts, always ready. Open the side panel to manage your call scripts.</p>
  <button class="open-panel-btn" id="openPanelBtn">📋 Open Side Panel</button>
  <p class="shortcut-hint">or press <kbd>Ctrl+Shift+S</kbd></p>
  <script src="popup.js"></script>
</body>
</html>
