<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriptPad — Branching Preview</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; background: #0a0a0a; min-height: 100vh; padding: 20px; }
    .phone-frame {
      width: 400px; height: 700px; border: 2px solid #333; border-radius: 12px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .phone-frame iframe { width: 100%; height: 100%; border: none; }
    h1 { color: #fff; font-family: Inter, sans-serif; text-align: center; margin-bottom: 20px; }
    .container { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ScriptPad v1.1 — Branching Scripts ⚡</h1>
    <div class="phone-frame">
      <iframe src="../extension/sidepanel/index.html"></iframe>
    </div>
  </div>
  <script>
    // Mock chrome.storage.local for browser preview
    if (typeof chrome === 'undefined' || !chrome.storage) {
      const store = {};
      window.chrome = {
        storage: {
          local: {
            get(keys, cb) {
              const result = {};
              (Array.isArray(keys) ? keys : [keys]).forEach(k => {
                if (store[k] !== undefined) result[k] = JSON.parse(JSON.stringify(store[k]));
              });
              cb(result);
            },
            set(data, cb) {
              Object.assign(store, JSON.parse(JSON.stringify(data)));
              if (cb) cb();
            }
          }
        }
      };
    }
  </script>
</body>
</html>
