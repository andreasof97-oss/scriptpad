<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScriptPad Pro — Subscription Active!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    p { font-size: 15px; color: #a1a1aa; line-height: 1.6; margin-bottom: 24px; }
    .hint { font-size: 13px; color: #71717a; }
    .accent { color: #6366f1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>Welcome to ScriptPad Pro!</h1>
    <p>Your subscription is now active. Go back to the ScriptPad extension — your Pro features will unlock automatically.</p>
    <p class="hint">You can close this tab. If Pro doesn't activate within a minute, try signing out and back in.</p>
  </div>
</body>
</html>
